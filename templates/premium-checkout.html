<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thanh toán</title>
</head>
<style>
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 40px auto;
      font-size: 20px;
    }
    body { font-family: Arial, sans-serif; background-color: #F6FCFF; text-align: center; padding: 20px; }
    h2 { color: #3674B5; }
    h3 { color: #EEC759; }
    button {
      width: 200px;
      padding: 10px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
    }
    button:hover { background: #218838; }
</style>
<body>
  <div class="container">
    <h2>Thanh toán gói: {{ package }}</h2>
    <p>Người dùng: {{ username }}</p>
    <p>Đơn giá: {{ price }} VND</p>
    <p>Số lượng: {{ quantity }}</p>
    <h3>Tổng cộng: {{ total }} VND</h3>
    <form id="premium-pay-form" method="post" action="/premium-payment">
      <input type="hidden" name="username" value="{{ username }}">
      <input type="hidden" name="package" value="{{ package }}">
      <input type="hidden" name="price" value="{{ price }}">
      <input type="hidden" name="quantity" value="{{ quantity }}">
      <button type="submit">Thanh toán ngay</button>
    </form>

    <!-- VNPay quick checkout button -->
    <div style="max-width:400px;margin:8px auto;text-align:center;">
      <button id="vnpay-btn-premium" type="button" class="btn" style="background:#0066cc">Thanh toán VNPay</button>
    </div>

    <script>
      document.getElementById('vnpay-btn-premium').addEventListener('click', async function () {
        try {
          const form = document.getElementById('premium-pay-form');
          const price = Number(form.querySelector('input[name="price"]').value || 0);
          const quantity = Number(form.querySelector('input[name="quantity"]').value || 1);
          const amount = price * quantity;

          const payload = new URLSearchParams();
          payload.append('amount', String(amount));
          const username = form.querySelector('input[name="username"]').value || '';
          if (username) payload.append('username', username);
          const packageVal = form.querySelector('input[name="package"]').value || 'premium';
          if (packageVal) payload.append('package', packageVal);

          const resp = await fetch('/create_payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: payload.toString(),
          });
          const data = await resp.json();
          if (data && data.payment_url) {
            window.location.href = data.payment_url;
          } else {
            alert('Không tạo được link thanh toán. Vui lòng thử lại.');
            console.error('create_payment response', data);
          }
        } catch (err) {
          console.error(err);
          alert('Lỗi khi tạo thanh toán VNPay');
        }
      });
    </script>
  </div>

  <form id="frmCreateOrder" action="https://sandbox.vnpayment.vn/button/websrc.html" method="POST" target="_top"> 
    <input type="hidden" name="cmd" value="pay"> 
    <input type="hidden" name="hosted_button_id" value="A7jOOUmOOo"> 
    <input type="hidden" name="hosted_button_token" value="2eebe4d8c2b69d03512931d2e4da486e181e5348ffc719540f43cbeb4064f2ac"> 
    <img alt="VNPAY - Thanh toan online" border="0" class="btnPopup" src="https://sandbox.vnpayment.vn/button/Images/paynow-1.png"> 
  </form>
  <script src="https://merchant.vnpay.vn/Scripts/jquery-3.5.1.min.js">
  </script>
  <link href="https://merchant.vnpay.vn/Scripts/lib/vnpayframe.css" rel="stylesheet"/> 
  <script src="https://merchant.vnpay.vn/Scripts/lib/vnpayframe.js"></script>
  <script src="https://merchant.vnpay.vn/Scripts/lib/openbutton.js"></script>
</body>
</html>
