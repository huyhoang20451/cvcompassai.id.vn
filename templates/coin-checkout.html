<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Coin Checkout - CV Compass</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #F6FCFF; }
    .box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 40px auto;
      font-size: 18px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #EEC759;
    }
    .summary {
      margin-bottom: 20px;
    }
    .summary p {
      margin: 8px 0;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Xác nhận thanh toán</h2>

    <div class="summary">
      <p>Người dùng: <strong>{{ username }}</strong></p>
      <p>Số lượng gói xu: <strong>{{ quantity }}</strong></p>
      <p>Đơn giá: <strong>{{ price }} đ / 2 xu</strong></p>
      <p>Thành tiền: <strong>{{ total }} đ</strong></p>
      <p>Số xu cộng thêm: <strong>{{ total_xu }} xu</strong></p>
    </div>

    <!-- Gửi yêu cầu thanh toán thật sự -->
    <form method="post" action="/coin-payment">
      <input type="hidden" name="username" value="{{ username }}">
      <input type="hidden" name="quantity" value="{{ quantity }}">
      <input type="hidden" name="price" value="{{ price }}">
      <button type="submit">Thanh toán ngay</button>
    </form>
  </div>
</body>
</html>
