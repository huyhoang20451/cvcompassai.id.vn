<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Coin Checkout - CV Compass</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #F6FCFF; }
    .box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 40px auto;
      font-size: 18px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #EEC759;
    }
    .summary {
      margin-bottom: 20px;
    }
    .summary p {
      margin: 8px 0;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Xác nhận thanh toán</h2>

    <div class="summary">
      <p>Người dùng: <strong>{{ username }}</strong></p>
      <p>Số lượng gói xu: <strong>{{ quantity }}</strong></p>
      <p>Đơn giá: <strong>{{ price }} đ / 2 xu</strong></p>
      <p>Thành tiền: <strong>{{ total }} đ</strong></p>
      <p>Số xu cộng thêm: <strong>{{ total_xu }} xu</strong></p>
    </div>

    <!-- Gửi yêu cầu thanh toán thật sự -->
    <form id="coin-pay-form" method="post" action="/coin-payment">
      <input type="hidden" name="username" value="{{ username }}">
      <input type="hidden" name="quantity" value="{{ quantity }}">
      <input type="hidden" name="price" value="{{ price }}">
      <button type="submit">Thanh toán ngay</button>
    </form>
    <!-- VNPay quick checkout button for xu -->
        <div style="max-width:400px;margin:8px auto;text-align:center;">
            <button id="vnpay-btn-xu" type="button" class="btn" style="background:#0066cc">Thanh toán VNPay</button>
        </div>

        <script>
      document.getElementById('vnpay-btn-xu').addEventListener('click', async function () {
        try {
              // compute total amount = price * quantity from hidden form inputs
              const form = document.getElementById('coin-pay-form');
              const price = Number(form.querySelector('input[name="price"]').value || 10000);
              const quantity = Number(form.querySelector('input[name="quantity"]').value || 1);
              const amount = price * quantity;

              const payload = new URLSearchParams();
              // send only the total amount (thành tiền)
              payload.append('amount', String(amount));
              // include username so server can map the order to a user
              const username = form.querySelector('input[name="username"]').value || '';
              if (username) payload.append('username', username);
              const packageVal = form.querySelector('input[name="package"]').value || 'xu';
              if (packageVal) payload.append('package', packageVal);

          const resp = await fetch('/create_payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: payload.toString(),
          });
          const data = await resp.json();
          if (data && data.payment_url) {
            window.location.href = data.payment_url;
          } else {
            alert('Không tạo được link thanh toán. Vui lòng thử lại.');
            console.error('create_payment response', data);
          }
        } catch (err) {
          console.error(err);
          alert('Lỗi khi tạo thanh toán VNPay');
        }
      });
        </script>
  </div>
</body>
</html>
