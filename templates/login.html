<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #f5f7fa; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { display: flex; background: #fff; border-radius: 15px; box-shadow: 0px 8px 20px rgba(0,0,0,0.15); overflow: hidden; width: 900px; max-width: 95%; }
    .left { flex: 1; background: #f9fbfc; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .left img { width: 90%; max-width: 400px; }
    .right { flex: 1; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
    .right h2 { font-size: 28px; color: #2d4f87; margin-bottom: 25px; text-align: center; }
    .input-group { position: relative; margin-bottom: 20px; }
    .input-group input { width: 100%; padding: 12px 40px 12px 40px; border: 1px solid #ccc; border-radius: 25px; outline: none; font-size: 14px; transition: 0.3s; }
    .input-group input:focus { border-color: #2d4f87; }
    .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888; }
    .options { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 20px; }
    .toggle { display: flex; align-items: center; gap: 5px; }
    .toggle input { appearance: none; width: 35px; height: 18px; background: #ccc; border-radius: 20px; position: relative; cursor: pointer; outline: none; transition: 0.3s; }
    .toggle input:checked { background: #2d89ef; }
    .toggle input:checked::before { left: 18px; }
    .toggle input::before { content: ""; position: absolute; width: 15px; height: 15px; border-radius: 50%; background: white; top: 1.5px; left: 2px; transition: 0.3s; }
    .divider { text-align: center; margin: 15px 0; font-size: 14px; color: #666; position: relative; }
    .divider::before, .divider::after { content: ""; position: absolute; width: 40%; height: 1px; background: #ccc; top: 50%; }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    .google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid #ccc; border-radius: 25px; padding: 10px; background: #fff; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
    .google-btn img { width: 20px; }
    .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .actions a { text-decoration: none; color: #2d4f87; font-size: 14px; }
    .btn-login { background: #2d4f87; color: #fff; padding: 12px; border: none; border-radius: 25px; cursor: pointer; width: 100px; transition: 0.3s; }
    .btn-login:hover { background: #1b376b; }
    .btn-register { background: transparent; border: 1px solid #2d4f87; color: #2d4f87; padding: 12px; border-radius: 25px; cursor: pointer; width: 100px; transition: 0.3s; }
    .btn-register:hover { background: #2d4f87; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Bên trái: ảnh minh họa -->
    <div class="left">
      <img src="/static/images/signin-out-img.png" alt="login illustration">
    </div>

    <!-- Bên phải: form đăng nhập -->
    <div class="right">
      <h2>Xin chào !</h2>
      <form action="/login" method="post">
        <div class="input-group">
          <i>👤</i>
          <input type="text" name="username" placeholder="Tên đăng nhập">
        </div>
        <div class="input-group">
          <i>🔒</i>
          <input type="password" name="password" placeholder="Mật khẩu">
        </div>
        <div class="options">
          <a href="#">Quên mật khẩu ?</a>
          <label class="toggle">
            <input type="checkbox">
            <span>Ghi nhớ tôi</span>
          </label>
        </div>
        <div style="margin-bottom:12px; margin-top:8px;">
          <label for="google-role" style="font-size:13px; color:#444; margin-right:8px;">Vai trò:</label>
          <select id="google-role" style="padding:6px 8px; border-radius:6px; border:1px solid #ccc;">
            <option value="candidate">Ứng viên</option>
            <option value="business">Nhà tuyển dụng</option>
          </select>
        </div>
  <div id="g_id_signin"></div>
        <div class="actions">
          <button onclick="location.href='/signup'" type="button" class="btn-register">Đăng ký</button>
          <button method='post' type="submit" class="btn-login">Đăng nhập</button>
        </div>
      </form>
      
    </div>
  </div>

  {% if success %}
<div style="position: fixed; top: 32px; right: 32px; background: #4caf50; color: #fff; padding: 16px 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); z-index: 999; font-size: 1.1rem;">
    Đăng ký thành công! Vui lòng đăng nhập.
</div>
{% endif %}

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    (function(){
      const googleBtn = document.querySelector('.google-btn');
      const roleSelect = document.getElementById('google-role');
      // Use server-provided GOOGLE_CLIENT_ID when available. If it's not passed to the template
      // this will render as null and we will disable the Google flow gracefully.
      const clientId = {{ google_client_id | default(None) | tojson }};

      function disableGoogle(reason){
        console.warn('Google Sign-In disabled:', reason);
        if (googleBtn){
          googleBtn.addEventListener('click', function(){
            alert('Google Sign-In không khả dụng: ' + reason);
          });
          googleBtn.classList.add('disabled');
          googleBtn.style.opacity = '0.6';
        }
        const gdiv = document.getElementById('g_id_signin');
        if (gdiv) gdiv.style.display = 'none';
      }

      function handleCredentialResponse(response) {
        console.log('GSI credential response', response);
        const id_token = response.credential;
        const role = (roleSelect && roleSelect.value) ? roleSelect.value : 'candidate';

        fetch('/google-login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id_token: id_token, role: role })
        }).then(async (res) => {
          if (res.redirected) { window.location.href = res.url; return; }
          if (res.ok) { window.location.reload(); return; }
          const t = await res.text();
          alert('Đăng nhập Google thất bại');
        }).catch(e => {
          console.error(e);
          alert('Lỗi mạng khi đăng nhập bằng Google');
        });
      }

      // If server didn't provide clientId, disable the Google button with a message
      if (!clientId) {
        disableGoogle('Client ID không được cấu hình');
        return;
      }

      // Initialize when GSI client is ready. Retry for a short period if not yet loaded.
      function initWhenReady(attemptsLeft=50){
        if (window.google && google.accounts && google.accounts.id) {
          try {
            console.log('Initializing Google Identity, clientId=', clientId);
            google.accounts.id.initialize({ client_id: clientId, callback: handleCredentialResponse });
            const renderTarget = document.getElementById('g_id_signin');
            if (renderTarget) {
              google.accounts.id.renderButton(renderTarget, { theme: 'outline', size: 'large' });
            }
            if (googleBtn) {
              googleBtn.addEventListener('click', function(){ google.accounts.id.prompt(); });
            }
          } catch (err){
            console.error('Error initializing Google Identity', err);
            disableGoogle('Lỗi khi khởi tạo GSI');
          }
        } else {
          if (attemptsLeft <= 0) {
            console.warn('GSI client not available after waiting');
            disableGoogle('GSI client không load được');
            return;
          }
          setTimeout(function(){ initWhenReady(attemptsLeft-1); }, 100);
        }
      }

      window.addEventListener('load', function(){ initWhenReady(); });
    })();
  </script>
</body>
</html>
