<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Service Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: linear-gradient(135deg, var(--page-grad-start) 0%, var(--page-grad-end) 100%);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: var(--max-width);
            margin: 24px auto;
            padding: 0 16px;
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: var(--shadow);
            border-radius: var(--radius);
            overflow: hidden;
        }
        thead {
            background: linear-gradient(90deg, rgba(37,99,235,0.1), rgba(245,158,11,0.1));
        }
        thead th {
            color: var(--muted);
            text-align: left;
            padding: 12px;
        }
        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tbody tr:hover {
            background-color: var(--glass);
        }
        td {
            padding: 12px;
            border-top: 1px solid rgba(15,23,36,0.03);
        }
        .badge {
            display: inline-block;
            padding: 6px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.green {
            background: #d1fae5;
            color: #065f46;
        }
        .badge.red {
            background: #fee2e2;
            color: #b91c1c;
        }
        .badge.blue {
            background: #065f46;
            color: #d1fae5;
            cursor: pointer;
        }
        .badge.blue:hover {
            background: #047857;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Service Management</h1>
        <button onclick="openAddServiceModal()">Thêm dịch vụ</button>
        <div id="addServiceModal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="close" title="Đóng">&times;</span>
                <form method="POST" action="/services" id="addForm">
                    <h2>Thêm dịch vụ mới</h2>
                    <label for="new_service_name">Service Name:</label>
                    <input type="text" id="new_service_name" name="name" required>
                    <label for="new_service_price">Price:</label>
                    <input type="text" id="new_service_price" name="price" required>
                    <label for="new_service_description">Description:</label>
                    <textarea id="new_service_description" name="description" required></textarea>
                    <div style="margin-top:12px; display:flex; gap:8px;">
                        <button type="submit">Thêm mới dịch vụ</button>
                        <button type="button" id="cancelAddBtn">Hủy</button>
                    </div>
                </form>
            </div>
        </div>
        <script>
            // Script cho modal Thêm dịch vụ
            (function(){
                const modal = document.getElementById('addServiceModal');
                const closeBtn = modal && modal.querySelector('.close');
                const cancelBtn = document.getElementById('cancelAddBtn');

                function openAddServiceModal(){
                    modal.style.display = 'flex';
                }

                function closeModal(){
                    modal.style.display = 'none';
                }

                // Cần đảm bảo hàm openAddServiceModal được khai báo global
                window.openAddServiceModal = openAddServiceModal;

                if (closeBtn) closeBtn.addEventListener('click', closeModal);
                if (cancelBtn) cancelBtn.addEventListener('click', closeModal);
                window.addEventListener('click', function(e){ if (e.target === modal) closeModal(); });
            })();
        </script>
        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Service Name</th>
                    <th>Price</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for service in services %}
                <tr>
                    <td>{{ service.id }}</td>
                    <td>{{ service.name }}</td>
                    <td>{{ service.price }}</td>
                    <td>{{ service.description }}</td>
                    <td>
                        <button type="button" class="badge blue edit-btn"
                            data-id="{{ service.id }}"
                            data-name="{{ service.name | e }}"
                            data-price="{{ service.price }}"
                            data-description="{{ service.description | e }}">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button onclick="deleteService(service.id)" type="button" class="badge red delete-btn"
                            data-id="{{ service.id }}">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <!-- Modal for editing a service -->
        <div id="editModal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="close" title="Đóng">&times;</span>
                <form method="POST" action="/services" id="editForm">
                    <h2>Cập nhật dịch vụ</h2>
                    <input type="hidden" id="service_id" name="service_id">
                    <label for="service_name">Service Name:</label>
                    <input type="text" id="service_name" name="name" required>
                    <label for="service_price">Price:</label>
                    <input type="text" id="service_price" name="price" required>
                    <label for="service_description">Description:</label>
                    <textarea id="service_description" name="description" required></textarea>
                    <div style="margin-top:12px; display:flex; gap:8px;">
                        <button type="submit">Cập nhật</button>
                        <button type="button" id="cancelBtn">Hủy</button>
                    </div>
                </form>
            </div>
        </div>
        <a href="/admin-dashboard"><-- Quay lại trang admin</a>
    </div>
    
    <style>
        /* Modal styles */
        .modal { position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 480px; max-width: 90%; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .modal-content h2 { margin-top: 0; }
        .modal-content label { display:block; margin-top: 8px; font-weight:600; }
        .modal-content input[type="text"], .modal-content textarea { width:100%; padding:8px; margin-top:6px; border:1px solid #ddd; border-radius:6px; }
        .modal-content textarea { min-height: 100px; resize: vertical; }
        .close { float: right; font-size: 22px; cursor: pointer; }
        .edit-btn { border:none; background:transparent; padding:8px 12px; cursor:pointer; border-radius:6px; }
        .edit-btn i { margin-right:6px; }
    </style>

    <script>
        (function(){
            const modal = document.getElementById('editModal');
            const closeBtn = modal && modal.querySelector('.close');
            const cancelBtn = document.getElementById('cancelBtn');
            const form = document.getElementById('editForm');

            function openModal(data){
                document.getElementById('service_id').value = data.id || '';
                document.getElementById('service_name').value = data.name || '';
                document.getElementById('service_price').value = data.price || '';
                document.getElementById('service_description').value = data.description || '';
                modal.style.display = 'flex';
            }

            function closeModal(){
                modal.style.display = 'none';
            }

            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', function(){
                    const data = {
                        id: this.getAttribute('data-id'),
                        name: this.getAttribute('data-name'),
                        price: this.getAttribute('data-price'),
                        description: this.getAttribute('data-description')
                    };
                    openModal(data);
                });
            });

            if (closeBtn) closeBtn.addEventListener('click', closeModal);
            if (cancelBtn) cancelBtn.addEventListener('click', closeModal);
            window.addEventListener('click', function(e){ if (e.target === modal) closeModal(); });
            // Intercept the modal form submit and send PATCH via fetch
            if (form) {
                form.addEventListener('submit', async function(e){
                    e.preventDefault();
                    const id = document.getElementById('service_id').value;
                    const name = document.getElementById('service_name').value;
                    const price = document.getElementById('service_price').value;
                    const description = document.getElementById('service_description').value;

                    // Determine target URL. Prefer RESTful /services/{id} if id present.
                    let target = form.getAttribute('action') || '/services';
                    // if target already ends with the id, avoid doubling
                    if (id) {
                        // ensure no trailing slash
                        target = target.replace(/\/$/, '');
                        if (!target.endsWith('/' + id)) {
                            target = target + '/' + encodeURIComponent(id);
                        }
                    }

                    try {
                        // send as form-encoded to match backend Form(...) parameters
                        const params = new URLSearchParams();
                        params.append('service_id', id);
                        if (name !== null) params.append('name', name);
                        if (price !== null) params.append('price', price);
                        if (description !== null) params.append('description', description);

                        const resp = await fetch(target, {
                            method: 'PATCH',
                            credentials: 'same-origin',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: params
                        });

                        if (!resp.ok) {
                            const text = await resp.text();
                            throw new Error('HTTP ' + resp.status + ' - ' + text);
                        }

                        // Try parse json response; if not JSON, ignore
                        let data = null;
                        try { data = await resp.json(); } catch(_) { data = null; }

                        // Update the table row in-place if found
                        const rows = document.querySelectorAll('table tbody tr');
                        for (const row of rows) {
                            const firstTd = row.querySelector('td');
                            if (!firstTd) continue;
                            if (String(firstTd.innerText).trim() === String(id)) {
                                const tds = row.querySelectorAll('td');
                                if (tds[1]) tds[1].innerText = name;
                                if (tds[2]) tds[2].innerText = price;
                                if (tds[3]) tds[3].innerText = description;
                                break;
                            }
                        }

                        closeModal();
                    } catch (err) {
                        console.error('Update service failed', err);
                        alert('Lỗi khi cập nhật dịch vụ: ' + (err.message || err));
                    }
                });
            }
        })();
        // Hàm cho xóa dịch vụ
        // Script cho XÓA DỊCH VỤ - Đã bọc trong IIFE và sửa logic để lắng nghe sự kiện
        (function setupDeleteListeners() {
            const deleteButtons = document.querySelectorAll('.delete-btn');
            deleteButtons.forEach(button => {
                button.addEventListener('click', async function(){
                    const serviceId = this.getAttribute('data-id');
                    if (!serviceId) return;

                    if (!confirm('Bạn có chắc chắn muốn xóa dịch vụ ID ' + serviceId + ' này không?')) {
                        return;
                    }

                    try {
                        // Gửi request POST đến endpoint /services/delete/{service_id}
                        const resp = await fetch('/services/delete/' + encodeURIComponent(serviceId), {
                            method: 'POST',
                            credentials: 'same-origin'
                        });

                        if (resp.ok || resp.status === 303) {
                            // Nếu backend trả về redirect (303), trình duyệt sẽ tự tải lại trang
                            // Tuy nhiên, vì dùng fetch, ta sẽ tải lại trang thủ công hoặc xóa hàng
                            // Chọn cách tải lại trang để cập nhật toàn bộ bảng:
                            alert('Xóa dịch vụ thành công! Trang sẽ được tải lại.');
                            window.location.reload();
                        } else {
                            const text = await resp.text();
                            throw new Error('HTTP ' + resp.status + ' - ' + text);
                        }
                    } catch (err) {
                        console.error('Delete service failed', err);
                        alert('Lỗi khi xóa dịch vụ: ' + (err.message || err));
                    }
                });
            });
        })();

    </script>
</body>
</html>
