<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Đăng nhập</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h2>Đăng nhập</h2>

  <!-- Nút đăng nhập Google -->
  <div id="g_id_onload"
       data-client_id="1003268141163-fthbmge9o5aotba1t7jb8neuttu72f01.apps.googleusercontent.com"
       data-context="signin"
       data-ux_mode="popup"
       data-callback="handleCredentialResponse"
       data-auto_prompt="false">
  </div>

  <div class="g_id_signin"
       data-type="standard"
       data-shape="rectangular"
       data-theme="outline"
       data-text="signin_with"
       data-size="large"
       data-logo_alignment="left">
  </div>

  <!-- Nhập thêm role / công ty (tuỳ chọn) -->
  <div style="margin-top: 20px;">
    <label>Vai trò:</label>
    <select id="role">
      <option value="candidate">Ứng viên</option>
      <option value="business">Doanh nghiệp</option>
    </select>

    <label>Tên công ty (nếu có):</label>
    <input type="text" id="company_name" placeholder="ABC Corp" />
  </div>

  <script>
    async function handleCredentialResponse(response) {
      // `response.credential` chính là Google ID Token
      const id_token = response.credential;
      const role = document.getElementById("role").value;
      const company_name = document.getElementById("company_name").value;

      try {
        const res = await fetch("/google-login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            id_token,
            role,
            company_name
          })
        });

        if (res.redirected) {
          // Nếu backend trả RedirectResponse thì trình duyệt sẽ tự chuyển hướng
          window.location.href = res.url;
        } else {
          const data = await res.json();
          alert(data.detail || "Đăng nhập thất bại");
        }
      } catch (err) {
        console.error("Lỗi khi gửi token:", err);
        alert("Đăng nhập thất bại, vui lòng thử lại!");
      }
    }
  </script>
</body>
</html>
